name: Build Sadguru Resort Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx @capacitor/cli sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output/Sadguru-Resort-Admin-v1.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sadguru-Resort-Admin-APK
          path: output/Sadguru-Resort-Admin-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Sadguru Resort Admin App v1.0.0 (APK)"
          body: |
            ### 📱 Sadguru Resort Admin Android App (APK)

            **Features in this release:**
            - 📷 Aadhaar Card Camera Scanner with real OCR & QR extraction
            - 🏨 Live 9-Room Floor Matrix (Deluxe AC & Deluxe Family)
            - 🏊 Fast-Track Swimming Pool Pass POS Terminal
            - 🚪 5-State Room Lifecycle with Early Check-Out & Housekeeping Clean verification
            - 🔄 Real-time Socket.IO sync with MongoDB Atlas & Website

            **How to install:**
            1. Download `Sadguru-Resort-Admin-v1.0.apk` below on your Android phone.
            2. Tap the file to install (allow "Install from unknown sources" if prompted).
            3. Open the app and log in with your resort credentials!
          files: output/Sadguru-Resort-Admin-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
